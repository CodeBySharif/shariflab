steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/sharif-lab-api:$COMMIT_SHA
      - -f
      - backend/Dockerfile
      - backend
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/sharif-lab-web:$COMMIT_SHA
      - --build-arg
      - VITE_SUPABASE_URL=$_VITE_SUPABASE_URL
      - --build-arg
      - VITE_SUPABASE_ANON_KEY=$_VITE_SUPABASE_ANON_KEY
      - --build-arg
      - VITE_API_URL=$_VITE_API_URL
      - -f
      - frontend/Dockerfile
      - frontend
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/sharif-lab-api:$COMMIT_SHA
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/sharif-lab-web:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sharif-lab-api
      - --image=gcr.io/$PROJECT_ID/sharif-lab-api:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --min-instances=1
      - --allow-unauthenticated
      - --set-secrets=DATABASE_URL=sharif-lab-db-url:latest,SUPABASE_SERVICE_ROLE_KEY=sharif-lab-service-role:latest
      - --set-env-vars=PUBLIC_API_URL=$_PUBLIC_API_URL,CORS_ORIGINS=$_CORS_ORIGINS,SUPABASE_URL=$_SUPABASE_URL
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sharif-lab-web
      - --image=gcr.io/$PROJECT_ID/sharif-lab-web:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated

images:
  - gcr.io/$PROJECT_ID/sharif-lab-api:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/sharif-lab-web:$COMMIT_SHA

substitutions:
  _VITE_SUPABASE_URL: https://your-project.supabase.co
  _VITE_SUPABASE_ANON_KEY: your-anon-key
  _VITE_API_URL: https://sharif-lab-api-PROJECT_HASH.run.app/api
  _PUBLIC_API_URL: https://sharif-lab-api-PROJECT_HASH.run.app
  _CORS_ORIGINS: https://sharif-lab-web-PROJECT_HASH.run.app
  _SUPABASE_URL: https://your-project.supabase.co
